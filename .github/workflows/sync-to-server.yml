name: sync-to-server

# 本地 push 到 GitHub 后：用自托管 runner 把 wp-content 打包推给内网服务器部署
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: [self-hosted, wordpress]
    steps:
      - uses: actions/checkout@v4

      - name: package wp-content
        run: |
          mkdir -p /tmp/pkg
          cp -a wp-content /tmp/pkg/ 2>/dev/null || true
          tar -C /tmp/pkg -czf /tmp/wp-content.tgz wp-content

      - name: push to server
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/gzip' \
            --data-binary @/tmp/wp-content.tgz \
            "http://192.168.8.50:9001/sync/31bce28b62eeae25b1ba00723227949f/wp"
